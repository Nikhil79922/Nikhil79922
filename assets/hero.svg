<style>
.b1{animation:d1 16s ease-in-out infinite}.b2{animation:d2 19s ease-in-out infinite}.b3{animation:d3 13s ease-in-out infinite}
@keyframes d1{50%{transform:translate(150px,40px)}}@keyframes d2{50%{transform:translate(-170px,-30px)}}@keyframes d3{50%{transform:translate(-100px,50px)}}
.r1{transform-origin:500px 190px;animation:spin 46s linear infinite}.r2{transform-origin:500px 190px;animation:spin 64s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.p{fill:#8fd0ff;opacity:0;animation:rise linear infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:.85}85%{opacity:.35}100%{transform:translateY(-130px);opacity:0}}
.role{opacity:0;animation:role 9s infinite}.r-2{animation-delay:3s}.r-3{animation-delay:6s}
@keyframes role{0%{opacity:0;transform:translateY(12px)}5%,30%{opacity:1;transform:translateY(0)}35%,100%{opacity:0;transform:translateY(-12px)}}
.dot{animation:pulse 2s ease-in-out infinite}@keyframes pulse{50%{opacity:.2}}
.draw{stroke-dasharray:360;stroke-dashoffset:360;animation:draw 1.6s .4s ease-out forwards}@keyframes draw{to{stroke-dashoffset:0}}
.in{opacity:0;animation:fin 1.2s .3s ease-out forwards}@keyframes fin{to{opacity:1}}
.n{font-family:'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;font-weight:800;font-size:60px;letter-spacing:4px}
.ro{font-family:'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;font-weight:500;font-size:26px;letter-spacing:2px}
.mo{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;font-size:12px}
.st{font-family:'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;font-weight:600;font-size:12.5px;letter-spacing:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
