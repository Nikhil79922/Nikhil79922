.num{font-family:'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;font-weight:800;font-size:32px}
.lb{font-family:'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;font-weight:600;font-size:11px;letter-spacing:2.5px;fill:#7f93b8}
