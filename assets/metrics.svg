<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 160" width="1000" height="160" role="img" aria-label="Key metrics: 5 production apps, 50,000+ users, 99.9% uptime, ~40% faster deployments, 4 payment gateways" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<clipPath id="cc"><rect width="184" height="140" rx="14"/></clipPath>
<linearGradient id="bd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5b9dff" stop-opacity=".7"/><stop offset=".6" stop-color="#5b9dff" stop-opacity=".15"/><stop offset="1" stop-color="#ffa726" stop-opacity=".45"/></linearGradient>
