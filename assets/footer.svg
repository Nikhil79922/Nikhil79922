<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 150" width="1000" height="150" role="img" aria-label="Lets build something reliable" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><filter id="glow" x="-20%" y="-30%" width="140%" height="160%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><linearGradient id="pulse"><stop offset="0" stop-color="#00e5ff" stop-opacity="0"/><stop offset=".5" stop-color="#00e5ff"/><stop offset="1" stop-color="#00e5ff" stop-opacity="0"/></linearGradient><clipPath id="c"><rect x="180" y="50" height="60" width="0"><animate attributeName="width" values="0;640;640" keyTimes="0;.25;1" dur="8s" repeatCount="indefinite"/></rect></clipPath></defs>
<rect x="1" y="1" width="998" height="148" rx="10" fill="#070d18" stroke="#00e5ff" stroke-opacity=".35"/><rect y="1" width="200" height="2" fill="url(#pulse)"><animate attributeName="x" values="-200;1000" dur="4s" repeatCount="indefinite"/></rect><rect y="147" width="200" height="2" fill="url(#pulse)"><animate attributeName="x" values="1000;-200" dur="4s" repeatCount="indefinite"/></rect><text x="500" y="42" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="14" letter-spacing="3" fill="#ffa726">// END OF TRANSMISSION</text><text x="180" y="94" font-family="'Courier New', Courier, monospace" font-size="30" font-weight="700" fill="#e8f4ff" textLength="640" lengthAdjust="spacingAndGlyphs" clip-path="url(#c)" filter="url(#glow)">LET&apos;S BUILD SOMETHING RELIABLE</text><rect x="180" y="68" width="12" height="34" fill="#00e5ff"><animate attributeName="x" values="180;820;820" keyTimes="0;.25;1" dur="8s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0;1" calcMode="discrete" keyTimes="0;.5;1" dur=".9s" repeatCount="indefinite"/></rect><circle cx="306" cy="127" r="5" fill="#39ff88"><animate attributeName="opacity" values="1;.2;1" dur="1.4s" repeatCount="indefinite"/></circle><text x="320" y="132" font-family="'Courier New', Courier, monospace" font-size="13" fill="#5b7088" textLength="372" lengthAdjust="spacing">CONNECTION OPEN // AVAILABLE FOR BACKEND ROLES</text>
</svg>