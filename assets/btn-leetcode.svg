<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 176 46" width="126" height="46" role="img" aria-label="Leetcode" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><clipPath id="c"><rect x="1" y="1" width="104" height="44" rx="22"/></clipPath>
<linearGradient id="sh" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".22"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>
<style>.sw{animation:sw 3.6s ease-in-out infinite}@keyframes sw{0%{transform:translateX(-60px) skewX(-20deg)}60%,100%{transform:translateX(200px) skewX(-20deg)}}
.bd{animation:bd 3s ease-in-out infinite}@keyframes bd{50%{stroke-opacity:.3}}
.tx{font-family:'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;font-weight:700;font-size:13px;letter-spacing:3px}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<rect x="1" y="1" width="174" height="44" rx="22" fill="#070d22"/>
<g clip-path="url(#c)"><rect class="sw" y="0" width="34" height="46" fill="url(#sh)"/></g>
<rect class="bd" x="1" y="1" width="174" height="44" rx="22" fill="none" stroke="#ffa726" stroke-opacity=".9" stroke-width="1.4"/>
<text class="tx" x="88" y="28" text-anchor="middle" fill="#ffa726">LEETCODE</text>
</svg>